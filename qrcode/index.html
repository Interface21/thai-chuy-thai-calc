<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code โครงการ</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7GRE4XR48C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-7GRE4XR48C');
    </script>    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Thai', sans-serif; 
            background-color: #DBD8C9; 
        }
        #qrcode img {
            border-radius: 8px;
            margin: auto;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    
    <div class="glass-card rounded-3xl shadow-xl p-8 max-w-sm w-full text-center">
        
        <h1 class="text-2xl font-bold text-slate-700 mb-1">สแกนเพื่อเข้าใช้งาน</h1>
        <p class="text-sm text-slate-500 mb-6 font-medium">โปรแกรมคำนวณ ไทยช่วยไทย พลัส</p>

        <!-- พื้นที่แสดง QR Code -->
        <div class="bg-slate-50/50 p-5 rounded-2xl flex flex-col justify-center items-center mb-6 shadow-inner border border-slate-200" id="qrcode-container">
            <div id="qrcode" class="p-2 bg-white rounded-xl shadow-sm border border-slate-100"></div>
            
            <p class="text-[11.5px] text-slate-500 mt-4 leading-relaxed font-medium">
                💡 ทริค: หากปุ่มบันทึกไม่ทำงาน<br>
                ให้ <span class="text-indigo-600 font-bold">แตะค้างที่รูปภาพ</span> (หรือคลิกขวา)<br>
                แล้วเลือก <span class="bg-slate-200 px-1.5 py-0.5 rounded text-slate-700">"บันทึกรูปภาพ"</span> ได้เลยครับ
            </p>
        </div>

        <!-- ปุ่มบันทึกรูปภาพ -->
        <button onclick="downloadQR()" class="w-full py-3.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl font-semibold transition-colors flex justify-center items-center gap-2 shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            บันทึก QR Code ลงเครื่อง
        </button>

        <!-- ปุ่มกลับไปหน้าแรก -->
        <a href="../" class="w-full mt-3 py-3.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-2xl font-bold transition-colors flex justify-center items-center gap-2 shadow-sm text-sm inline-block">
            กลับไปหน้าคำนวณ
        </a>
        
    </div>

    <!-- Toast Notification -->
    <div id="toastMessage" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none text-xs font-medium w-[90%] max-w-[300px] text-center z-50 flex items-center justify-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastText">ข้อความ</span>
    </div>

    <script>
        // ลิงก์ของแอปหลักบน GitHub Pages ของคุณ
        const url = "https://interface21.github.io/thai-chuy-thai-calc/";
        let toastTimeout;

        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), {
                text: url,
                width: 200,
                height: 200,
                colorDark : "#334155", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H 
            });
        };

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toastText.innerHTML = message;
            if(type === 'success') toastIcon.innerHTML = '✅';
            else if(type === 'error') toastIcon.innerHTML = '⚠️';
            else toastIcon.innerHTML = 'ℹ️';

            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 4000);
        }

        function downloadQR() {
            const qrContainer = document.getElementById("qrcode");
            const canvas = qrContainer.querySelector("canvas");
            const img = qrContainer.querySelector("img");

            let dataUrl = "";
            if (img && img.src && img.src.startsWith("data:")) {
                dataUrl = img.src;
            } else if (canvas) {
                try {
                    dataUrl = canvas.toDataURL("image/png");
                } catch(e) {
                    console.error("Canvas toDataURL Error:", e);
                }
            }

            if (!dataUrl) {
                showToast("รูปภาพยังไม่พร้อม กรุณารอสักครู่", "error");
                return;
            }

            try {
                const link = document.createElement('a');
                link.download = 'QR_ThaiChuyThai.png';
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast("กำลังดาวน์โหลด... (ถ้าไม่มีอะไรเกิดขึ้น ให้แตะค้างที่รูปภาพเพื่อเซฟ)", "success");
            } catch(error) {
                showToast("เบราว์เซอร์บล็อกการดาวน์โหลดอัตโนมัติ<br>กรุณาแตะค้างที่รูปภาพเพื่อเซฟ", "error");
            }
        }
    </script>
</body>
</html>
